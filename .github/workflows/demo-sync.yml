name: CI and delivery
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  demo-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate workflow syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck='' .github/workflows/demo-sync.yml
      - run: google-chrome --version
      - run: npm run test:sync

  native-ci:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare native test tools
        run: |
          mkdir -p work
          command -v ffmpeg >/dev/null || brew install ffmpeg
          test -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' || brew install --cask google-chrome
      - name: Full regression and verified DMG
        run: |
          npm test
          npm run build:dmg
          npm run acceptance:ui
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish-release:
    needs: [demo-sync, native-ci]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      current: ${{ steps.branch.outputs.current }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: branch
        run: node scripts/check-delivery.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: steps.branch.outputs.current == 'true'
        with:
          name: macos-dmg
          path: dist
      - name: Publish new version or resume same-commit draft
        if: steps.branch.outputs.current == 'true'
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  pages:
    needs: publish-release
    if: needs.publish-release.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: branch
        run: node scripts/check-delivery.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - id: prepare
        if: steps.branch.outputs.current == 'true'
        name: Compare published content and use verified stable download
        run: node scripts/prepare-pages.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
        if: steps.prepare.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.prepare.outputs.changed == 'true'
        with:
          path: work/pages
      - uses: actions/deploy-pages@v4
        if: steps.prepare.outputs.changed == 'true'
        id: deployment
